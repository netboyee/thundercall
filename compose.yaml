services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      MYSQL_DATABASE: thundercall
      MYSQL_USER: thundercall
      MYSQL_PASSWORD: thundercall
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uthundercall -pthundercall --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    labels:
      autoheal: "true"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    labels:
      autoheal: "true"
    env_file:
      - .env.docker
    environment:
      THUNDERCALL_MYSQL_DSN: thundercall:thundercall@tcp(mysql:3306)/thundercall?charset=utf8mb4&parseTime=true&loc=UTC
      THUNDERCALL_API_LISTEN_ADDR: :8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/thundercall", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingest:
    build:
      context: .
      target: ingest
    restart: unless-stopped
    labels:
      autoheal: "true"
    profiles:
      - nwws
    env_file:
      - .env.docker
    environment:
      THUNDERCALL_MYSQL_DSN: thundercall:thundercall@tcp(mysql:3306)/thundercall?charset=utf8mb4&parseTime=true&loc=UTC
      THUNDERCALL_REDIS_ADDR: redis:6379
      THUNDERCALL_REDIS_STREAM: thundercall:messages
      THUNDERCALL_REDIS_GROUP: thundercall-workers
      THUNDERCALL_REDIS_CONSUMER: ingest
      THUNDERCALL_HEARTBEAT_PATH: /dev/shm/thundercall/ingest.heartbeat
      THUNDERCALL_HEARTBEAT_MAX_AGE: 8m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/thundercall", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    labels:
      autoheal: "true"
    env_file:
      - .env.docker
    environment:
      THUNDERCALL_MYSQL_DSN: thundercall:thundercall@tcp(mysql:3306)/thundercall?charset=utf8mb4&parseTime=true&loc=UTC
      THUNDERCALL_REDIS_ADDR: redis:6379
      THUNDERCALL_REDIS_STREAM: thundercall:messages
      THUNDERCALL_REDIS_GROUP: thundercall-workers
      THUNDERCALL_REDIS_CONSUMER: worker-1
      THUNDERCALL_HEARTBEAT_PATH: /dev/shm/thundercall/worker.heartbeat
      THUNDERCALL_HEARTBEAT_MAX_AGE: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/thundercall", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  voice-dispatcher:
    build:
      context: .
      target: voice-dispatcher
    restart: unless-stopped
    labels:
      autoheal: "true"
    env_file:
      - .env.docker
    environment:
      THUNDERCALL_MYSQL_DSN: thundercall:thundercall@tcp(mysql:3306)/thundercall?charset=utf8mb4&parseTime=true&loc=UTC
      THUNDERCALL_HEARTBEAT_PATH: /dev/shm/thundercall/voice-dispatcher.heartbeat
      THUNDERCALL_HEARTBEAT_MAX_AGE: 45s
      THUNDERCALL_VOICE_CONSUMER: voice-dispatcher-1
      THUNDERCALL_VOICE_CLAIM_BATCH_SIZE: 25
      THUNDERCALL_VOICE_CPS: 1
      THUNDERCALL_VOICE_CLAIM_LEASE: 2m
      THUNDERCALL_VOICE_RETRY_DELAY: 30s
      THUNDERCALL_VOICE_IDLE_SLEEP: 2s
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/thundercall", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mysql-data:
